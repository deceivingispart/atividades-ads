<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela de Cadastro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-formulario">
      <div class="cabecalho">
        <p class="titulo">Cadastro</p>
        <p class="subtitulo">Preencha seus dados para se cadastrar.</p>
      </div>
      <form action="#" method="POST">
        <div class="campo">
          <label for="nome">Nome Completo:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome completo"
            required
          />
        </div>

        <div class="campo">
          <label for="email">E-mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
          />
        </div>

        <div class="campo">
          <label for="senha">Senha:</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            required
          />
        </div>

        <div class="campo-secundario">
          <div class="campo">
            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required />
          </div>

          <div class="campo">
            <label for="genero">Gênero:</label>
            <select id="genero" name="genero" required>
              <option value="" disabled selected>Selecione uma opção</option>
              <option value="masculino">Masculino</option>
              <option value="feminino">Feminino</option>
              <option value="outro">Outro</option>
              <option value="prefiro-nao-dizer">Prefiro não dizer</option>
            </select>
          </div>
        </div>

        <div class="campo-termos">
          <input type="checkbox" id="termos" name="termos" required />
          <label for="termos">Aceito os termos</label>
        </div>

        <button type="submit" class="btn-finalizar">Cadastrar</button>
        <div class="ajuda">Precisa de ajuda? <a href="#">Clique aqui</a></div>
      </form>
    </div>
  </body>
</html>
